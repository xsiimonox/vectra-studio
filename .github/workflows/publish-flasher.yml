name: Publish Vectra Schachtwaechter flasher

on:
  push:
    branches: [main]
    paths:
      - examples/d1-mini-vl53l0x-water-level.yaml
      - flasher/**
      - .github/workflows/publish-flasher.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP8266 firmware and ESP Web Tools manifest
        id: firmware
        uses: esphome/build-action@v8.1.0
        with:
          yaml-file: examples/d1-mini-vl53l0x-water-level.yaml
          version: 2026.10.0
          complete-manifest: true
      - name: Assemble flasher site
        run: |
          mkdir -p site/firmware
          cp flasher/index.html site/index.html
          cp -R "${{ steps.firmware.outputs.name }}/." site/firmware/
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
