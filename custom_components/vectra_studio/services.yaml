write_schedule_group:
  name: Write schedule group
  description: >-
    Writes Schedule1 to every device in the same schedule group as the
    named device (every light sharing its exact group_mask, or just the
    one device for a pump, which has no group concept). Group membership
    is re-verified live immediately before writing, not read from cache.
  fields:
    device_id:
      name: Device
      description: >-
        Any one member of the target schedule group -- a light or a pump,
        never the Tank device itself.
      required: true
      selector:
        device:
          integration: vectra_studio
    points:
      name: Points
      description: >-
        The schedule points to write, in the same channel-name (light) or
        mode-parameter (pump) dictionary shape returned by
        vectra_studio/read_schedule_group.
      required: true
      selector:
        object:

set_schedule_intensity:
  name: Set schedule intensity
  description: >-
    Sets the schedule-level master intensity (a light-only concept,
    separate from the schedule's own points) for every device in the
    named light's own schedule group. Group membership is re-verified
    live immediately before writing, not read from cache.
  fields:
    device_id:
      name: Device
      description: >-
        Any one member of the target light's own schedule group -- never
        a pump, and never the Tank device itself.
      required: true
      selector:
        device:
          integration: vectra_studio
    intensity:
      name: Intensity
      description: The schedule-level intensity to set, as a percentage.
      required: true
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"

adjust_water_level:
  name: Schacht-Wasserstand nachregeln
  description: >-
    Prüft genau einen gefilterten Wasserstandswert und verändert die
    Konstantleistung höchstens um einen kleinen Schritt. Während Pause,
    Szene, Pumpenstillstand, ungültigen Messwerten und der hydraulischen
    Wartezeit wird nichts verändert. Wiederholt über eine Automation aufrufen.
  fields:
    level_sensor:
      name: Wasserstandssensor
      description: Gefilterter tatsächlicher Wasserstand in Zentimetern.
      required: true
      selector:
        entity:
          domain: sensor
    power_entity:
      name: Vectra-Konstantleistung
      description: Die Konstantleistungs-Number-Entität der Vectra-Pumpe.
      required: true
      selector:
        entity:
          domain: number
          integration: vectra_studio
    operation_state_sensor:
      name: Betriebszustand
      description: Vectra-Sensor mit Schedule, LiveDemo, Scene oder OOB.
      required: true
      selector:
        entity:
          domain: sensor
          integration: vectra_studio
    motor_speed_sensor:
      name: Ist-Leistung
      description: Vectra-Motordrehzahl in Prozent; 0 % sperrt die Regelung.
      required: true
      selector:
        entity:
          domain: sensor
          integration: vectra_studio
    target_cm:
      name: Soll-Wasserstand
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 0.1
          unit_of_measurement: cm
    deadband_cm:
      name: Totzone
      description: Innerhalb dieser Abweichung erfolgt keine Änderung.
      default: 0.3
      selector:
        number:
          min: 0.05
          max: 5
          step: 0.05
          unit_of_measurement: cm
    step_percent:
      name: Leistungsschritt
      default: 1
      selector:
        number:
          min: 1
          max: 10
          step: 1
          unit_of_measurement: "%"
    minimum_percent:
      name: Mindestleistung
      default: 10
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
    maximum_percent:
      name: Höchstleistung
      default: 100
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
    settle_seconds:
      name: Hydraulische Wartezeit
      description: Nach einer Leistungsänderung werden Wasserbewegungen so lange ignoriert.
      default: 120
      selector:
        number:
          min: 10
          max: 3600
          step: 10
          unit_of_measurement: s
    confirmations:
      name: Bestätigungen
      description: So viele aufeinanderfolgende Abweichungen sind vor einer Änderung nötig.
      default: 3
      selector:
        number:
          min: 1
          max: 20
          step: 1
    higher_power_lowers_level:
      name: Mehr Leistung senkt den Schachtstand
      description: Für typische Rückförderschächte aktiviert lassen; andernfalls deaktivieren.
      default: true
      selector:
        boolean:
    max_sample_age_seconds:
      name: Maximales Messwertalter
      default: 30
      selector:
        number:
          min: 5
          max: 600
          step: 5
          unit_of_measurement: s
    max_pump_state_age_seconds:
      name: Maximales Alter des Pumpenzustands
      description: Verhindert Änderungen mit alten Werten nach Verbindungsverlust oder Ausschalten.
      default: 90
      selector:
        number:
          min: 30
          max: 600
          step: 10
          unit_of_measurement: s
