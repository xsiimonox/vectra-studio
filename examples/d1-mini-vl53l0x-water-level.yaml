# Vectra Schachtwächter: Wemos D1 mini + VL53L0X for a 15 cm return chamber.
# Measure sensor-to-bottom distance precisely and change empty_distance_cm.
# The optical window/splash guard must already be fitted during calibration.
substitutions:
  device_name: vectra-schachtwaechter
  friendly_name: Vectra Schachtwächter
  empty_distance_cm: "18.4"
  shaft_height_cm: "15.0"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  project:
    name: xsiimonox.vectra_schachtwaechter
    version: "0.7.2"

esp8266:
  board: d1_mini

logger:

api:

ota:
  - platform: esphome

wifi:
  # On first start, join the temporary access point below and use its
  # captive portal to enter the local Wi-Fi credentials. This keeps network
  # credentials out of the public flash image and Git repository.
  ap:
    ssid: "${friendly_name} Fallback"
    password: "vectra-setup"

captive_portal:

# Enables ESP Web Tools to offer Wi-Fi setup immediately after browser flashing.
improv_serial:

i2c:
  # Wiring used by the Vectra Schachtwächter:
  # VL53L0X SDA -> D3 / GPIO0, SCL -> D4 / GPIO2.
  sda: D3
  scl: D4
  scan: true

# Initial value for browser-flashed devices. Once Home Assistant has adopted
# the ESP, set this number to the measured lens-to-dry-bottom distance.
number:
  - platform: template
    id: shaft_empty_distance
    name: "Leerabstand"
    unit_of_measurement: cm
    min_value: 1
    max_value: 100
    step: 0.1
    initial_value: ${empty_distance_cm}
    restore_value: true
    optimistic: true

sensor:
  - platform: vl53l0x
    id: shaft_distance
    name: "Sensorabstand"
    address: 0x29
    update_interval: 1s
    unit_of_measurement: cm
    accuracy_decimals: 2
    filters:
      # ESPHome's VL53L0X component reports metres.
      - multiply: 100.0
      # Remove isolated reflections from ripples, bubbles and droplets.
      - median:
          window_size: 7
          send_every: 1
          send_first_at: 1
      # Slow low-pass filter: about 15 seconds of history, sent every 5 s.
      - sliding_window_moving_average:
          window_size: 15
          send_every: 5

  - platform: template
    id: shaft_water_level
    name: "Wasserstand"
    unit_of_measurement: cm
    device_class: distance
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 5s
    lambda: |-
      if (isnan(id(shaft_distance).state)) return NAN;
      const float level = id(shaft_empty_distance).state - id(shaft_distance).state;
      if (level < 0.0f || level > (${shaft_height_cm} + 1.0f)) return NAN;
      return std::min((float) ${shaft_height_cm}, level);
