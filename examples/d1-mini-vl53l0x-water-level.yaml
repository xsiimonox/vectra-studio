# Vectra Schachtwächter: Wemos D1 mini + VL53L0X for a 15 cm return chamber.
# Measure sensor-to-bottom distance precisely and change empty_distance_cm.
# The optical window/splash guard must already be fitted during calibration.
substitutions:
  device_name: vectra-schachtwaechter
  friendly_name: Vectra Schachtwächter
  empty_distance_cm: "18.4"
  shaft_height_cm: "15.0"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  project:
    name: xsiimonox.vectra_schachtwaechter
    version: "0.7.5"

esp8266:
  board: d1_mini

logger:

api:

ota:
  - platform: esphome
  - platform: http_request

# The ESP8266 has no certificate store. The request is encrypted with HTTPS,
# but GitHub Pages' certificate cannot be validated on this hardware.
http_request:
  useragent: vectra-schachtwaechter
  timeout: 10s
  verify_ssl: false

# Compares the installed project version with the published manifest every six
# hours. The web interface and Home Assistant expose manual check/install
# controls; an update is never installed automatically.
update:
  - platform: http_request
    id: shaft_firmware_update
    name: "Firmware Update"
    source: https://xsiimonox.github.io/vectra-studio/firmware/manifest.json
    update_interval: 6h

web_server:
  port: 80
  version: 3

wifi:
  # On first start, join the temporary access point below and use its
  # captive portal to enter the local Wi-Fi credentials. This keeps network
  # credentials out of the public flash image and Git repository.
  ap:
    ssid: "${friendly_name} Fallback"
    password: "vectra-setup"

captive_portal:

# Enables ESP Web Tools to offer Wi-Fi setup immediately after browser flashing.
improv_serial:

i2c:
  # Use the D1 mini's normal I²C pins. D4/GPIO2 drives the blue on-board LED
  # and must not be used as SCL: a permanently lit LED indicates a stuck bus.
  sda: D2
  scl: D1
  scan: true

# The VL53L0X is sampled every second for filtering. These two values can be
# changed from Home Assistant without reflashing the ESP.
number:
  - platform: template
    id: shaft_empty_distance
    name: "Leerabstand"
    unit_of_measurement: cm
    min_value: 1
    max_value: 100
    step: 0.1
    initial_value: ${empty_distance_cm}
    restore_value: true
    optimistic: true

  - platform: template
    id: shaft_measurement_interval
    name: "Messintervall"
    unit_of_measurement: s
    device_class: duration
    min_value: 2
    max_value: 60
    step: 1
    initial_value: 10
    restore_value: true
    optimistic: true

button:
  - platform: template
    name: "Nach Firmware-Update suchen"
    icon: mdi:update
    entity_category: config
    on_press:
      - component.update: shaft_firmware_update

  - platform: template
    name: "Firmware-Update installieren"
    icon: mdi:download
    entity_category: config
    on_press:
      - update.perform:
          id: shaft_firmware_update

globals:
  - id: shaft_last_published_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: shaft_last_sensor_response_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

sensor:
  - platform: vl53l0x
    id: shaft_distance_filtered
    internal: true
    address: 0x29
    update_interval: 1s
    filters:
      # ESPHome's VL53L0X component reports metres.
      - multiply: 100.0
      # Remove isolated reflections from ripples, bubbles and droplets.
      - median:
          window_size: 9
          send_every: 1
          send_first_at: 1
      # A 21-second average removes the regular up/down movement of the
      # water surface while retaining real, sustained level changes.
      - sliding_window_moving_average:
          window_size: 21
          send_every: 1
          send_first_at: 1
    on_value:
      then:
        - lambda: |-
            if (isnan(x)) return;
            const uint32_t now = millis();
            id(shaft_last_sensor_response_ms) = now;
            const uint32_t interval_ms = (uint32_t) (id(shaft_measurement_interval).state * 1000.0f);
            if (id(shaft_last_published_ms) == 0 || now - id(shaft_last_published_ms) >= interval_ms) {
              id(shaft_last_published_ms) = now;
              id(shaft_distance).publish_state(x);
              id(shaft_water_level).update();
            }

  - platform: template
    id: shaft_distance
    name: "Sensorabstand"
    unit_of_measurement: cm
    device_class: distance
    state_class: measurement
    accuracy_decimals: 2
    update_interval: never

  - platform: template
    id: shaft_water_level
    name: "Wasserstand"
    unit_of_measurement: cm
    device_class: distance
    state_class: measurement
    accuracy_decimals: 2
    update_interval: never
    lambda: |-
      if (isnan(id(shaft_distance).state)) return NAN;
      const float level = id(shaft_empty_distance).state - id(shaft_distance).state;
      if (level < 0.0f || level > (${shaft_height_cm} + 1.0f)) return NAN;
      return std::min((float) ${shaft_height_cm}, level);

binary_sensor:
  - platform: template
    id: shaft_sensor_healthy
    name: "Sensor aktiv"
    device_class: connectivity
    entity_category: diagnostic

# A locked I²C bus produces no new VL53L0X values. Report that state to Home
# Assistant and reboot after two minutes so transient sensor lockups recover.
interval:
  - interval: 30s
    then:
      - lambda: |-
          const uint32_t now = millis();
          const bool healthy = id(shaft_last_sensor_response_ms) != 0 &&
              now - id(shaft_last_sensor_response_ms) <= 120000;
          id(shaft_sensor_healthy).publish_state(healthy);
          if (now > 180000 && !healthy) {
            ESP_LOGW("shaft_watchdog", "No VL53L0X response for two minutes; rebooting");
            ESP.restart();
          }
